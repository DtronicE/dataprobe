[package]
name = "dataprobe"
version = "0.1.0"
edition = "2021"

[lib]
name = "dataprobe"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "dataprobe"
path = "src/main.rs"

[dependencies]
polars = { version = "0.46", features = ["lazy", "csv", "parquet", "json"] }
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
blake3 = "1.5"
regex = "1.10"
pyo3 = { version = "0.20", features = ["extension-module"], optional = true }

[features]
default = []
python = ["dep:pyo3"]
